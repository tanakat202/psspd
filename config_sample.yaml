# step0_translation.py Configuration file sample
# Usage: python3 step0_translation.py config_sample.yaml

#===========================================================
# Executable settings
# Manage paths to external tool executables here
# If not specified, searches from PATH
#===========================================================
executables:
  # BLAST+ tools
  # makeblastdb: "makeblastdb"    # makeblastdb executable path
  # blastp: "blastp"              # blastp executable path
  # blastn: "blastn"              # blastn executable path

  # GMAP
  # gmap_build: "gmap_build"      # gmap_build executable path
  # gmap: "gmap"                  # gmap executable path
  # perl: "perl"                  # Specify if gmap_build's shebang is broken

  # Primer3
  # primer3_core: "primer3_core"  # primer3_core executable path

  # Python (Usually not required)
  # python3: "python3"            # Python interpreter path

#===========================================================
# Settings for each step below
#===========================================================

# Species list to process (the single source of truth).
#
# Prefixes are assigned automatically from the list order:
#   1st entry -> AA, 2nd -> AB, ..., 26th -> AZ, 27th -> BA, ... (up to ZZ).
# Every downstream step derives its per-species settings (database names,
# targets, file paths, ...) from this list, so species are listed only here.
#
# Each entry needs two filenames placed under Materials/DL_data/:
#   cds:    CDS FASTA (input to step0 translation)
#   genome: whole-genome FASTA (used to build GMAP / BLASTN databases)
# step0 generates for each species:
#   {prefix}/{prefix}.aa.fasta    - Amino acid sequences
#   {prefix}/{prefix}.cds.fasta   - CDS sequences
#   {prefix}/{prefix}.list        - gene-number -> original-ID mapping
#
# reference_count: the first N species are treated as the reference species
# (default 1). The reference set is used by the no-hit / extract-nohit steps
# and is read separately when building the primer list; the remaining species
# are the "other" species used for GMAP and pair-candidate generation.
reference_count: 1

species:
  - cds: "cds_from_GCA_002007945.1_ASM200794v1_genomic.fna"   # -> AA (reference)
    genome: "GCA_002007945.1_ASM200794v1_genomic.fna"
  - cds: "GCA_000184455.3_cds_from_genomic.fna"               # -> AB (other)
    genome: "GCA_000184455.3_ASM18445v3_genomic.fna"
  - cds: "GCA_030270545.1_cds_from_genomic.fna"               # -> AC (other)
    genome: "GCA_030270545.1_ASM3027054v1_genomic.fna"

# Path to codon table file (required)
# Format: codon<TAB>amino_acid
# e.g.: ATG	M
codon_file: "Codon.txt"

# BLASTP database build settings
# This step has no configurable settings:
# - input_files are derived from the species list (all species' .aa.fasta).
# - the concatenated FASTA file name is fixed (all_aa.fasta).
# - the database type is fixed (prot).

# BLASTP settings
# database/query (all_aa.fasta, the same all-vs-all FASTA) and output
# (blastp.out) are fixed; they are not configurable.
blastp:
  # E-value threshold (default: 1E-5)
  evalue: "1E-5"

  # Output format (default: 6 = tabular format)
  outfmt: 6

  # Number of threads (default: 4)
  num_threads: 4

# pick_nohit_genes.py settings
# The target species are the reference species (see reference_count above),
# so no per-species setting is needed here.

# extract_nohit.fa.py settings
# This step has no configurable settings:
# - the no-hit gene list (../BLASTP/blastp_nohits.tab), the input CDS template
#   (../Materials/{target}/{target}.cds.fasta) and the output
#   (../BLASTP/Nohit_cds.fa) are fixed.
# - the reference species ({target}) are derived from the species list.

# GMAP database build settings
# This step has no configurable settings:
# - databases (one per non-reference species) are derived from the species list.
# - the database directory is fixed (GMAP).

# GMAP execution settings
# Usage: cd GMAP && python3 run_gmap.py ../config.yaml
# databases (one per non-reference species) are derived from the species list.
# The query (../BLASTP/Nohit_cds.fa) and database directory (GMAP) are fixed.
gmap:
  # Output format (default: gff3_gene)
  # Other options: gff3_match_cdna, gff3_match_est, coords, align, etc.
  output_format: "gff3_gene"

# make_hit_list.py settings
# targets (non-reference species) are derived from the species list; no
# per-species setting is needed here.

# make_complete_list.py settings
# This step has no configurable settings:
# - hit_files (non-reference species) are derived from the species list.
# - input_cds (../BLASTP/Nohit_cds.fa) and the Target list / CDS outputs are fixed.

# Primer3 input file generation settings
# Usage: cd Primer3 && python3 make_primer3_input.py ../config.yaml
# input_cds (../GMAP/Target_cds.fa) and output_file (primer3_input.list) are fixed.
make_primer3_input:
  # Primer3 parameters (optional, with default values)
  primer_opt_size: 20
  primer_min_size: 18
  primer_max_size: 27
  product_size_range: "300-500"

# Primer3 settings
# Usage: cd Primer3 && python3 run_primer3.py ../config.yaml
# This step has no configurable settings: the input (primer3_input.list) and
# output (primer3_output.list) file paths are fixed.

# createFasta settings
# Usage: cd Primer3 && python3 createFasta.py ../config.yaml
# This step has no configurable settings: the input (primer3_output.list) and
# output FASTA (primer3.fa) paths are fixed.

# BLASTN database build settings
# Usage: cd Primer3 && python3 build_blastn_db.py ../config.yaml
# This step has no configurable settings:
# - databases (one per species, using each genome) are derived from the species list.
# - the database type is fixed (nucl).

# BLASTN (blastn-short) settings
# Usage: cd Primer3 && python3 run_blastn_short.py ../config.yaml
# databases (one per species) are derived from the species list.
# The query file is fixed (primer3.fa).
blastn_short:
  # Output format (default: 6 = tabular)
  outfmt: 6

  # Number of threads (default: 4)
  num_threads: 4

  # E-value threshold (default: "10").
  # Quote the value so both "10" and "1E-5" are accepted.
  evalue: "10"

# Hit region extraction and pair candidate creation settings
# Usage: cd Primer3 && python3 run_extract_hit_regions.py ../config.yaml
# targets (all species) are derived from the species list.
extract_hit_regions:
  # Maximum allowed distance (bp) between primer pairs (default: 5000)
  max_distance: 5000

# Primer list creation settings
# Usage: cd Primer3 && python3 run_make_primer_list.py ../config.yaml
# This step has no configurable settings:
# - pair_files (non-reference species) are derived from the species list; the
#   reference species' pair file is read separately by make_primerList3_Wo5000.py.
# - the output path (possiblePair.list) is fixed.

# Append original sequence IDs to unique_primer3.tab
# Usage: cd Primer3 && python3 add_original_id.py ../config.yaml
# This step has no configurable settings: the input (unique_primer3.tab) and
# output (unique_primer3_with_original_id.tab) table paths and the Materials
# directory (../Materials) are fixed. Reads per-species mapping files saved by
# step0_translation.py ({materials_dir}/{prefix}/{prefix}.list) and appends the
# original FASTA ID as a new last column of the input file.
