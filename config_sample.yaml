# step0_translation.py Configuration file sample
# Usage: python3 step0_translation.py config_sample.yaml

#===========================================================
# Executable settings
# Manage paths to external tool executables here
# If not specified, searches from PATH
#===========================================================
executables:
  # BLAST+ tools
  # makeblastdb: "makeblastdb"    # makeblastdb executable path
  # blastp: "blastp"              # blastp executable path
  # blastn: "blastn"              # blastn executable path

  # GMAP
  # gmap_build: "gmap_build"      # gmap_build executable path
  # gmap: "gmap"                  # gmap executable path
  # perl: "perl"                  # Specify if gmap_build's shebang is broken

  # Primer3
  # primer3_core: "primer3_core"  # primer3_core executable path

  # Python (Usually not required)
  # python3: "python3"            # Python interpreter path

#===========================================================
# Settings for each step below
#===========================================================

# Species list to process (multiple entries allowed)
# input_file: filename only. Files must be placed under Materials/DL_data/
# The following files are generated for each species:
#   {prefix}/{prefix}.aa.fasta    - Amino acid sequences
#   {prefix}/{prefix}.cds.fasta   - CDS sequences
#   {prefix}/{prefix}.list        - Gene list
species:
  - prefix: "SpeciesA"
    input_file: "cds_from_GCA_002007945.1_ASM200794v1_genomic.fna"
  - prefix: "SpeciesB"
    input_file: "GCA_000184455.3_cds_from_genomic.fna"
  - prefix: "SpeciesC"
    input_file: "GCA_030270545.1_cds_from_genomic.fna"

# Path to codon table file (required)
# Format: codon<TAB>amino_acid
# e.g.: ATG	M
codon_file: "Codon.txt"

# BLASTP database build settings
build_blastp_db:
  # List of input FASTA files (required)
  input_files:
    - "../Materials/SpeciesA/SpeciesA.aa.fasta"
    - "../Materials/SpeciesB/SpeciesB.aa.fasta"
    - "../Materials/SpeciesC/SpeciesC.aa.fasta"

  # Concatenated FASTA file path (required)
  output_fasta: "../BLASTP/all_aa.fasta"

  # Database type (default: prot)
  # prot: Protein database, nucl: Nucleotide database
  dbtype: "prot"

# BLASTP settings
blastp:
  # BLASTP database file path (required)
  database: "../BLASTP/all_aa.fasta"

  # Query file path (required)
  query: "../BLASTP/all_aa.fasta"

  # Output file path (required)
  output: "../BLASTP/blastp.out"

  # E-value threshold (default: 1E-5)
  evalue: "1E-5"

  # Output format (default: 6 = tabular format)
  outfmt: 6

  # Number of threads (default: 4)
  num_threads: 4

# pick_nohit_genes.py settings
no_hit_analysis:
  # Target species name (required)
  # e.g.: SpeciesA, SpeciesB, SpeciesC etc.
  target: "SpeciesA"

# extract_nohit.fa.py settings
extract_nohit:
  # Target species name (required)
  target: "SpeciesA"

  # No-hit gene list file (required)
  nohits_file: "../BLASTP/blastp_nohits.tab"

  # Input CDS file path (required)
  # {target} is replaced with the actual species name
  input_cds_file: "../Materials/{target}/{target}.cds.fasta"

  # Output file path (required)
  output_file: "../BLASTP/Nohit_cds.fa"

# GMAP database build settings
gmap_build:
  # Directory to create the database (required)
  # Corresponds to the -D option
  db_dir: "GMAP"

  # List of databases to build
  # Databases can be built for multiple genomes
  databases:
    - name: "SpeciesB"
      genome: "../Materials/DL_data/GCA_000184455.3_ASM18445v3_genomic.fna"
    - name: "SpeciesC"
      genome: "../Materials/DL_data/GCA_030270545.1_ASM3027054v1_genomic.fna"

# GMAP execution settings
# Usage: cd GMAP && python3 run_gmap.py ../config.yaml
gmap:
  # Query file (CDS sequences with no BLASTP hits)
  query: "../BLASTP/Nohit_cds.fa"

  # Output format (default: gff3_gene)
  # Other options: gff3_match_cdna, gff3_match_est, coords, align, etc.
  output_format: "gff3_gene"

  # List of databases to search
  # name: GMAP database name (built with gmap_build.databases)
  # output: Output GFF3 file name
  databases:
    - name: "SpeciesB"
      output: "SpeciesB.gff3"
    - name: "SpeciesC"
      output: "SpeciesC.gff3"

# make_hit_list.py settings
make_hit_list:
  # List of GFF3 files to process
  # When prefix is specified, reads {prefix}.gff3 and outputs {prefix}_hit.tab
  targets:
    - prefix: "SpeciesB"
    - prefix: "SpeciesC"

# make_complete_list.py settings
make_complete_list:
  # List of hit list files (required)
  # Collects hit IDs from each file
  hit_files:
    - "../GMAP/SpeciesB_hit.tab"
    - "../GMAP/SpeciesC_hit.tab"

  # Input CDS file (required)
  # CDS sequences with no BLASTP hits
  input_cds: "../BLASTP/Nohit_cds.fa"

  # Output file (required)
  output_list: "../GMAP/Target.list"
  output_cds: "../GMAP/Target_cds.fa"

# Primer3 input file generation settings
# Usage: cd Primer3 && python3 make_primer3_input.py ../config.yaml
make_primer3_input:
  # Input CDS file (Target_cds.fa)
  input_cds: "../GMAP/Target_cds.fa"

  # Output file (primer3_input.list)
  output_file: "../Primer3/primer3_input.list"

  # Primer3 parameters (optional, with default values)
  primer_opt_size: 20
  primer_min_size: 18
  primer_max_size: 27
  product_size_range: "300-500"

# Primer3 settings
# Usage: cd Primer3 && python3 run_primer3.py ../config.yaml
primer3:
  # Input file path (required)
  # Input file for primer3_core
  input_file: "primer3_input.list"

  # Output file path (required)
  # Output destination of primer3_core
  output_file: "primer3_output.list"

# createFasta settings
# Usage: cd Primer3 && python3 createFasta.py ../config.yaml
create_fasta:
  # Input file (output of primer3_core)
  input_file: "primer3_output.list"

  # Output FASTA file
  output_file: "primer3.fa"

# BLASTN database build settings
# Usage: cd Primer3 && python3 build_blastn_db.py ../config.yaml
build_blastn_db:
  # Database type (default: nucl)
  dbtype: "nucl"

  # List of databases to build
  # name: Database name
  # input: Path to input genome file
  # output: Output database name (defaults to {name}.fna if omitted)
  databases:
    - name: "SpeciesA"
      input: "../Materials/DL_data/GCA_002007945.1_ASM200794v1_genomic.fna"
      output: "SpeciesA.fna"
    - name: "SpeciesB"
      input: "../Materials/DL_data/GCA_000184455.3_ASM18445v3_genomic.fna"
      output: "SpeciesB.fna"
    - name: "SpeciesC"
      input: "../Materials/DL_data/GCA_030270545.1_ASM3027054v1_genomic.fna"
      output: "SpeciesC.fna"

# BLASTN (blastn-short) settings
# Usage: cd Primer3 && python3 run_blastn_short.py ../config.yaml
blastn_short:
  # Query file (primer sequences)
  query: "primer3.fa"

  # Output format (default: 6 = tabular)
  outfmt: 6

  # Number of threads (default: 4)
  num_threads: 4

  # List of databases to search
  # name: Database name
  # db: Path to BLAST database
  # output: Output file name (defaults to {name}.out if omitted)
  databases:
    - name: "SpeciesA"
      db: "SpeciesA.fna"
      output: "SpeciesA.out"
    - name: "SpeciesB"
      db: "SpeciesB.fna"
      output: "SpeciesB.out"
    - name: "SpeciesC"
      db: "SpeciesC.fna"
      output: "SpeciesC.out"

# Hit region extraction and pair candidate creation settings
# Usage: cd Primer3 && python3 run_extract_hit_regions.py ../config.yaml
extract_hit_regions:
  # List of species to process
  # prefix: BLASTN output file prefix (reads {prefix}.out)
  targets:
    - prefix: "SpeciesA"
    - prefix: "SpeciesB"
    - prefix: "SpeciesC"

# Primer list creation settings
# Usage: cd Primer3 && python3 run_make_primer_list.py ../config.yaml
make_primer_list:
  # List of pair candidate files to include in possiblePair.list
  # SpeciesA is the reference species and is not included (Read separately by make_primerList3_Wo5000.py)
  pair_files:
    - "SpeciesB_possiblePair2000.tab"
    - "SpeciesC_possiblePair2000.tab"

  # Output path for possiblePair.list (optional)
  pair_list_file: "possiblePair.list"

# Append original sequence IDs to unique_primer3.tab
# Usage: cd Primer3 && python3 add_original_id.py ../config.yaml
# Reads per-species mapping files saved by step0_translation.py:
#   {materials_dir}/{prefix}/{prefix}.list
# and appends the original FASTA ID as a new last column of input_file.
add_original_id:
  # Input file (output of make_primerList3_Wo5000.py)
  input_file: "unique_primer3.tab"

  # Output file (with original ID appended as the last column)
  output_file: "unique_primer3_with_original_id.tab"

  # Path to Materials directory (relative to Primer3/)
  materials_dir: "../Materials"
